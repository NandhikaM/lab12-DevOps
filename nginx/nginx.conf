events {}

http {
  # active.inc holds exactly one line: "server app-blue:3000;" or "server app-green:3000;"
  upstream live_app {
    include /etc/nginx/active.inc;
  }

  server {
    listen 80;

    location / {
      proxy_pass http://live_app;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }
}
